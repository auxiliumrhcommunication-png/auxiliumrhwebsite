<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="t">
  <title id="t">Sélection de candidats : trois profils, dont un retenu, examinés à la loupe</title>
  <defs>
    <filter id="s" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#071233" flood-opacity="0.14"/></filter>
    <clipPath id="a1"><circle cx="0" cy="0" r="30"/></clipPath>
  </defs>
  <rect x="40" y="40" width="520" height="400" rx="200" fill="#EEF3FF"/>
  <circle cx="510" cy="90" r="18" fill="#DCE4FB"/>
  <circle cx="80" cy="400" r="12" fill="#DCE6FF"/>
  <!-- carte gauche -->
  <g transform="translate(70 150) rotate(-6)" filter="url(#s)">
    <rect width="190" height="230" rx="20" fill="#fff"/>
    <g transform="translate(95 62)"><circle r="30" fill="#DCE6FF"/><g clip-path="url(#a1)"><circle cy="-6" r="12" fill="#5C3A21"/><path d="M-22 30c0-14 10-22 22-22s22 8 22 22z" fill="#86A6FF"/></g></g>
    <rect x="45" y="110" width="100" height="10" rx="5" fill="#0F172A" opacity="0.8"/>
    <rect x="60" y="130" width="70" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="25" y="160" width="140" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="25" y="178" width="110" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="25" y="200" width="50" height="16" rx="8" fill="#EEF3FF"/><rect x="82" y="200" width="44" height="16" rx="8" fill="#EEF3FF"/>
  </g>
  <!-- carte droite -->
  <g transform="translate(345 165) rotate(6)" filter="url(#s)">
    <rect width="190" height="230" rx="20" fill="#fff"/>
    <g transform="translate(95 62)"><circle r="30" fill="#DCE4FB"/><g clip-path="url(#a1)"><circle cy="-6" r="12" fill="#7A4A2A"/><path d="M-12 -14c4-8 20-8 24 0v-2c-2-9-22-9-24 2z" fill="#1F1410"/><path d="M-22 30c0-14 10-22 22-22s22 8 22 22z" fill="#4F78F5"/></g></g>
    <rect x="45" y="110" width="100" height="10" rx="5" fill="#0F172A" opacity="0.8"/>
    <rect x="60" y="130" width="70" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="25" y="160" width="140" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="25" y="178" width="120" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="25" y="200" width="56" height="16" rx="8" fill="#EEF3FF"/><rect x="88" y="200" width="40" height="16" rx="8" fill="#EEF3FF"/>
  </g>
  <!-- carte centrale retenue -->
  <g transform="translate(200 105)" filter="url(#s)">
    <rect width="210" height="260" rx="22" fill="#fff" stroke="#0C37C7" stroke-width="3"/>
    <g transform="translate(105 72)"><circle r="36" fill="#0C37C7"/><g clip-path="url(#a1)" transform="scale(1.2)"><circle cy="-6" r="12" fill="#9C6644"/><path d="M-13 -12c2-10 24-10 26 0c1-12-27-14-26 0z" fill="#1F1410"/><path d="M-22 30c0-14 10-22 22-22s22 8 22 22z" fill="#fff"/></g></g>
    <rect x="50" y="128" width="110" height="11" rx="5.5" fill="#0F172A"/>
    <rect x="68" y="149" width="74" height="8" rx="4" fill="#94A3B8"/>
    <g transform="translate(30 178)">
      <rect width="150" height="8" rx="4" fill="#E2E8F0"/><rect width="128" height="8" rx="4" fill="#0C37C7"/>
      <rect y="20" width="150" height="8" rx="4" fill="#E2E8F0"/><rect y="20" width="110" height="8" rx="4" fill="#0C37C7"/>
      <rect y="40" width="150" height="8" rx="4" fill="#E2E8F0"/><rect y="40" width="138" height="8" rx="4" fill="#0A2DA3"/>
    </g>
    <g transform="translate(176 -14)"><circle r="24" fill="#0A2DA3"/><path d="M-10 0l7 7 13-14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <!-- loupe -->
  <g transform="translate(420 300)">
    <line x1="34" y1="34" x2="78" y2="78" stroke="#071233" stroke-width="16" stroke-linecap="round"/>
    <circle r="48" fill="#fff" fill-opacity="0.55" stroke="#071233" stroke-width="12"/>
    <path d="M-22 -12a26 26 0 0 1 22 -16" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- étoiles -->
  <g transform="translate(92 92)" fill="#0A2DA3">
    <path d="M0 -12l3.5 7 7.7 1.1-5.6 5.4 1.3 7.7L0 5.6l-6.9 3.6 1.3-7.7-5.6-5.4 7.7-1.1z"/>
    <path transform="translate(30 0)" d="M0 -12l3.5 7 7.7 1.1-5.6 5.4 1.3 7.7L0 5.6l-6.9 3.6 1.3-7.7-5.6-5.4 7.7-1.1z"/>
    <path transform="translate(60 0)" d="M0 -12l3.5 7 7.7 1.1-5.6 5.4 1.3 7.7L0 5.6l-6.9 3.6 1.3-7.7-5.6-5.4 7.7-1.1z" fill="#DCE6FF"/>
  </g>
</svg>
